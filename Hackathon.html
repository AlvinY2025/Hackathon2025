<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymGenie: AI Workout Planner</title>
    <!-- Load Tailwind CSS CDN for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: Set debug level for better console logging during development
        setLogLevel('Debug');

        // Global variables provided by the Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gymgenie-app';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const apiKey = ""; // API key for Gemini API

        let db;
        let auth;
        let userId = null;
        let isAuthReady = false;

        // Reactive state variables
        let currentPlan = { content: null, timestamp: null };
        let currentPage = 'dashboard';
        let isGenerating = false;

        // --- Core Firebase Functions ---

        // Helper to get the Document Reference for the user's single plan file (6 segments: C/D/C/D/C/D)
        function getCurrentPlanDocRef() {
            if (!db || !userId) return null;
            // Valid Document Path for private data: artifacts/{appId}/users/{userId}/plan_data/current_plan_doc
            return doc(db, `artifacts/${appId}/users/${userId}/plan_data/current_plan_doc`);
        }

        async function setupFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        isAuthReady = true;
                        console.log('User signed in. UID:', userId);
                        document.getElementById('user-id-display').textContent = `User ID: ${userId}`;
                        setupRealtimeListeners();
                    } else {
                        userId = null;
                        isAuthReady = true;
                        console.log('User signed out/anonymous.');
                        document.getElementById('user-id-display').textContent = `User ID: Not Signed In`;
                        renderApp();
                    }
                });

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

            } catch (error) {
                console.error("Firebase setup failed:", error);
                document.getElementById('app-container').innerHTML = renderError('Firebase setup failed. Check console for details.');
            }
        }

        function setupRealtimeListeners() {
            const planDocRef = getCurrentPlanDocRef();
            if (!planDocRef) return;

            // Listen for the user's current plan document
            onSnapshot(planDocRef, (doc) => {
                if (doc.exists()) {
                    currentPlan = { id: doc.id, ...doc.data() };
                    // Ensure content is not null if the document exists
                    if (!currentPlan.content) {
                        currentPlan.content = "No plan content found. Generate a new plan!";
                    }
                } else {
                    currentPlan = { content: "Welcome! Generate your first custom workout plan.", timestamp: null };
                }
                console.log('Current plan updated:', currentPlan);
                renderApp();
            }, (error) => {
                console.error("Error fetching current plan:", error);
                alertModal("Failed to load plan data.", true);
            });
        }

        async function savePlan(planContent) {
            if (!db || !userId) {
                alertModal("Authentication failed. Cannot save plan.", true);
                return;
            }
            try {
                const planDocRef = getCurrentPlanDocRef();
                await setDoc(planDocRef, {
                    content: planContent,
                    timestamp: new Date().toISOString()
                }, { merge: true });
                alertModal("New plan saved successfully!");
            } catch (e) {
                console.error("Error saving plan: ", e);
                alertModal("Failed to save plan.", true);
            }
        }


        // --- Gemini API Function ---

        async function generateWorkoutPlan(event) {
            event.preventDefault();
            if (isGenerating) return;

            const form = event.target;
            const goal = form.goal.value.trim();
            const duration = form.duration.value.trim();
            const frequency = form.frequency.value.trim();
            const experience = form.experience.value;

            if (!goal || !duration || !frequency || !experience) {
                alertModal("Please fill out all plan details.", true);
                return;
            }

            isGenerating = true;
            renderApp();

            const userQuery = `Create a ${frequency} per week workout plan. My main fitness goal is: ${goal}. I have ${experience} experience, and the plan should cover a ${duration} period. Provide warm-ups and cool-downs for each workout day.`;

            const systemPrompt = `You are a professional fitness coach and AI workout planner. Your task is to generate a detailed, structured, and easy-to-follow weekly workout plan. The plan must be in English. The output must be in clear **Markdown format**, starting with a bold title, followed by a brief introduction, and then the structured plan (e.g., Day 1, Day 2, etc.) using markdown headings and lists. Do not include any conversational filler or instructions outside of the final, generated plan text.`;
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            let responseText = "Failed to generate plan. Please try again.";
            let attempt = 0;
            const maxAttempts = 3;
            const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            while (attempt < maxAttempts) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        responseText = result.candidates?.[0]?.content?.parts?.[0]?.text || "No plan text received.";
                        break; // Success, exit loop
                    } else {
                        throw new Error(`API returned status ${response.status}`);
                    }
                } catch (error) {
                    console.error(`Attempt ${attempt + 1} failed:`, error);
                    attempt++;
                    if (attempt < maxAttempts) {
                        await delay(1000 * Math.pow(2, attempt)); // Exponential backoff
                    }
                }
            }

            isGenerating = false;
            // Save the generated plan, which will trigger the onSnapshot listener and update the UI
            await savePlan(responseText);
            setPage('dashboard');
        }


        // --- UI Rendering Functions ---

        function setPage(page) {
            currentPage = page;
            renderApp();
        }

        function renderMarkdown(markdownText) {
            if (!markdownText) return '';
            
            // Very basic Markdown to HTML conversion for display
            let html = markdownText;
            
            // H2
            html = html.replace(/^##\s*(.*)$/gm, '<h3 class="text-2xl font-bold text-gray-800 mt-4 mb-2">$1</h3>');
            // H1 (Title)
            html = html.replace(/^#\s*(.*)$/gm, '<h2 class="text-3xl font-extrabold text-indigo-700 border-b pb-2 mb-4">$1</h2>');

            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Italic
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // Lists (ul)
            html = html.replace(/^\*\s*(.*)$/gm, '<li><p class="mb-1 text-gray-700">$1</p></li>');
            html = `<ul class="list-disc pl-5 space-y-2">${html}</ul>`;
            // Remove empty <ul> if no list items were found (occurs after h3/strong conversion)
            html = html.replace(/<ul class="list-disc pl-5 space-y-2">((<h3|<strong).*?)*<\/ul>/gs, (match) => {
                if (!match.includes('<li>')) {
                    // If no list items, return content without <ul> tags (preserving headings/bold)
                    return match.replace(/<ul class="list-disc pl-5 space-y-2">|<\/ul>/g, '');
                }
                return match;
            });
            
            // Paragraphs (Handle remaining lines as paragraphs)
            html = html.split('\n').map(line => {
                line = line.trim();
                if (line && !line.startsWith('<h') && !line.startsWith('<li>') && !line.startsWith('<ul') && !line.startsWith('</ul') && !line.startsWith('<strong') && !line.startsWith('<em>')) {
                    return `<p class="mb-3 leading-relaxed text-gray-700">${line}</p>`;
                }
                return line;
            }).join('');
            
            // Clean up multiple spaces/newlines
            html = html.replace(/<p><\/p>/g, '').replace(/<p>\s*<ul>/g, '<ul>').replace(/<\/ul>\s*<p>/g, '</ul>');
            
            return html;
        }

        // Main rendering function
        function renderApp() {
            const appContainer = document.getElementById('app-container');
            let contentHTML = '';

            // Loading state
            if (!isAuthReady) {
                appContainer.innerHTML = renderLoading('Initializing app...');
                return;
            }

            // --- Dashboard Content (Current Plan) ---
            if (currentPage === 'dashboard') {
                const planContent = currentPlan.content || "No plan generated yet. Navigate to the 'Generate Plan' tab to create your first routine!";
                const timestamp = currentPlan.timestamp ? new Date(currentPlan.timestamp).toLocaleString() : 'N/A';
                
                contentHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h2 class="text-3xl font-extrabold text-indigo-800">My Current Workout Plan</h2>
                            <button onclick="setPage('plan-generator')" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150">
                                Generate New Plan
                            </button>
                        </div>
                        <p class="text-sm text-gray-500 italic">Last Generated: ${timestamp}</p>
                        
                        <div class="bg-gray-50 p-6 rounded-xl shadow-inner border border-indigo-100 min-h-[300px]">
                            ${renderMarkdown(planContent)}
                        </div>
                        
                    </div>
                `;
            }

            // --- Plan Generator Content ---
            else if (currentPage === 'plan-generator') {
                if (isGenerating) {
                    contentHTML = renderLoading('Generating your personalized plan. This may take a moment...');
                } else {
                    contentHTML = `
                        <div class="space-y-8">
                            <h2 class="text-3xl font-extrabold text-indigo-700 border-b pb-2 mb-4">AI Plan Generator</h2>
                            <p class="text-gray-600">Tell GymGenie about your goals to create a custom weekly workout routine.</p>

                            <form id="plan-form" onsubmit="generateWorkoutPlan(event)" class="bg-white p-6 rounded-xl shadow-lg space-y-6 border border-indigo-200">
                                <!-- Goal Input -->
                                <div>
                                    <label for="goal" class="block text-sm font-medium text-gray-700 mb-1">Primary Fitness Goal</label>
                                    <input type="text" id="goal" name="goal" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., Build Muscle Mass, Lose Weight, Improve Endurance">
                                </div>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <!-- Duration Input -->
                                    <div>
                                        <label for="duration" class="block text-sm font-medium text-gray-700 mb-1">Plan Duration</label>
                                        <input type="text" id="duration" name="duration" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., 8 weeks or 1 month">
                                    </div>
                                    
                                    <!-- Frequency Input -->
                                    <div>
                                        <label for="frequency" class="block text-sm font-medium text-gray-700 mb-1">Workouts Per Week</label>
                                        <input type="number" id="frequency" name="frequency" required min="1" max="7" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g., 4">
                                    </div>
                                </div>

                                <!-- Experience Level -->
                                <div>
                                    <label for="experience" class="block text-sm font-medium text-gray-700 mb-1">Experience Level</label>
                                    <select id="experience" name="experience" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border bg-white focus:border-indigo-500 focus:ring-indigo-500">
                                        <option value="">Select Level</option>
                                        <option value="Beginner">Beginner (New to exercise)</option>
                                        <option value="Intermediate">Intermediate (Consistent for 6+ months)</option>
                                        <option value="Advanced">Advanced (Experienced, 1+ year consistent training)</option>
                                    </select>
                                </div>
                                
                                <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-md shadow-lg text-lg font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.01]">
                                    Generate Custom Plan
                                </button>
                            </form>
                        </div>
                    `;
                }
            }

            appContainer.innerHTML = contentHTML;
            updateNavColors();
        }

        // --- Utility UI Functions ---
        function renderLoading(message) {
            return `
                <div class="flex flex-col items-center justify-center h-64 text-center p-8 bg-indigo-50 rounded-xl shadow-inner">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-600 mb-4"></div>
                    <p class="text-lg font-semibold text-gray-700">${message}</p>
                </div>
            `;
        }

        function renderError(message) {
            return `
                <div class="p-8 text-center text-red-700 bg-red-100 rounded-lg shadow-lg">
                    <h2 class="text-xl font-bold mb-2">System Error</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function updateNavColors() {
            document.querySelectorAll('.nav-button').forEach(btn => {
                if (btn.dataset.page === currentPage) {
                    btn.classList.remove('text-gray-600', 'hover:text-indigo-600');
                    btn.classList.add('bg-indigo-500', 'text-white', 'shadow-md');
                } else {
                    btn.classList.remove('bg-indigo-500', 'text-white', 'shadow-md');
                    btn.classList.add('text-gray-600', 'hover:text-indigo-600', 'hover:bg-indigo-100');
                }
            });
        }

        function alertModal(message, isError = false) {
            const modal = document.getElementById('alert-modal');
            const messageEl = document.getElementById('alert-message');
            const headerEl = document.getElementById('alert-header');
            const bgColor = isError ? 'bg-red-500' : 'bg-green-500';

            headerEl.textContent = isError ? 'Attention' : 'Success';
            headerEl.className = `text-xl font-bold text-white p-3 rounded-t-lg ${bgColor}`;
            messageEl.textContent = message;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }, 3000); // Hide after 3 seconds
            modal.classList.remove('opacity-0');
        }

        // Expose functions globally for HTML event handlers
        window.setupFirebase = setupFirebase;
        window.setPage = setPage;
        window.generateWorkoutPlan = generateWorkoutPlan;
        window.renderApp = renderApp;

        // Initialize the application on load
        window.onload = setupFirebase;
    </script>

    <!-- Configure Inter font and custom theme -->
    <style>
        :root {
            font-family: 'Inter', sans-serif;
        }
        .main-bg {
            background-color: #f0f4f8; /* Light blue/gray background */
        }
    </style>
</head>
<body class="main-bg min-h-screen p-4 sm:p-8">

    <!-- Global Alert/Message Modal (replaces alert()) -->
    <div id="alert-modal" class="fixed top-0 right-0 m-4 w-64 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="rounded-lg shadow-xl overflow-hidden">
            <div id="alert-header" class="text-xl font-bold text-white p-3 rounded-t-lg">Header</div>
            <div class="bg-white p-4">
                <p id="alert-message" class="text-gray-700"></p>
            </div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl p-6 sm:p-10 border-t-8 border-indigo-600">

        <!-- Header and User Info -->
        <header class="mb-8 border-b pb-4">
            <h1 class="text-4xl font-extrabold text-indigo-800 flex items-center">
                <svg class="w-8 h-8 mr-3 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-1.343 3-3s-1.343-3-3-3m0 6v-6"></path></svg>
                GymGenie
            </h1>
            <p class="text-sm text-gray-500 mt-1" id="user-id-display">Connecting...</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex space-x-2 mb-8 p-1 bg-gray-100 rounded-xl shadow-inner">
            <button data-page="dashboard" onclick="setPage('dashboard')" class="nav-button flex-1 py-3 px-4 rounded-lg font-semibold text-gray-600 transition duration-150">
                <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19H3v-7m6 7h3m-3 0V6"></path></svg>
                Current Plan
            </button>
            <button data-page="plan-generator" onclick="setPage('plan-generator')" class="nav-button flex-1 py-3 px-4 rounded-lg font-semibold text-gray-600 transition duration-150">
                <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.158A1 1 0 0112 1.996l3 1.5a1 1 0 01.5.866v3.659L19.5 9a1 1 0 01.5.866v4.613a1 1 0 01-.5.866l-7.45 3.725a1 1 0 01-1 0L3.5 15.345a1 1 0 01-.5-.866V9.866a1 1 0 01.5-.866L8.5 6.273V2.866a1 1 0 01.5-.866l3-1.5z"></path></svg>
                Generate Plan
            </button>
        </nav>

        <!-- Dynamic Content Area -->
        <main id="app-container" class="min-h-96">
            <!-- Content will be rendered here by JavaScript -->
            <div class="flex items-center justify-center h-48">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500"></div>
                <p class="ml-4 text-gray-600">Initializing app...</p>
            </div>
        </main>
    </div>

</body>
</html>
